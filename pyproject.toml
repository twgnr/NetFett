[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netfett"
version = "0.1.0"
description = "NetFett – full-featured network monitor and protocol analyzer (PySide6, pure Python)"
authors = [{ name = "Tobias Wagner" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6", "cryptography>=42"]

[project.optional-dependencies]
geoip = ["maxminddb>=2.0"]      # optional: GeoLite2-Land/Stadt/ASN-Auflösung
build = ["pyinstaller>=6.0"]    # packaging/build.py → Windows-.exe

[project.urls]
Homepage = "https://www.twgnr.de"
Source = "https://github.com/twgnr/NetFett"

[project.scripts]
netfett = "netfett.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"netfett.gui" = ["*.ico"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
