[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netfett"
version = "0.1.0"
description = "NetFett – vollwertiger Netzwerk-Monitor und Protokoll-Analyzer (PySide6, reines Python)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6", "cryptography>=42"]

[project.optional-dependencies]
geoip = ["maxminddb>=2.0"]      # optional: GeoLite2-Land/Stadt/ASN-Auflösung

[project.scripts]
netfett = "netfett.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
